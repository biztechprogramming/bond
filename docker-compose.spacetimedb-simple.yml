version: '3.8'

services:
  spacetimedb:
    image: clockworklabs/spacetime:v2.0.2
    container_name: bond-spacetimedb
    restart: unless-stopped
    ports:
      - "18787:3000"
    volumes:
      - ~/.bond/spacetimedb:/home/spacetime/.local/share/spacetime/data
      - ~/.bond/spacetimedb-config:/home/spacetime/.config/spacetime
    command: start