version: '3.8'

# Local SpacetimeDB instance for validating version upgrades before
# rolling them out to prod. Runs on localhost:18787 against a dedicated
# data volume; prod runs on loki:18787 (same port, different host).
#
# Workflow: pin the new image tag here, validate locally, then copy the
# tag into docker-compose.spacetimedb-simple.yml (and -spacetimedb.yml)
# and delete this file until the next upgrade.
services:
  spacetimedb-next:
    image: clockworklabs/spacetime:v2.2.0
    container_name: bond-spacetimedb-next
    restart: unless-stopped
    ports:
      # Different host port from prod (18787) so both can run side-by-side
      # while we validate. When 2.2.0 is cleared, copy the tag into
      # docker-compose.spacetimedb{,-simple}.yml on port 18787 and remove
      # this file.
      - "18797:3000"
    volumes:
      - ~/.bond/spacetimedb-next:/home/spacetime/.local/share/spacetime/data
      # Mount the same signing keys as prod so existing JWT tokens
      # (cloned data references prod's owner identity) keep working.
      - ~/.bond/spacetimedb-config-next:/home/spacetime/.config/spacetime
    command: start
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
