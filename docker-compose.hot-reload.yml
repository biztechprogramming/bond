version: "3.8"

# Opt-in overlay for backend hot-reload. Mounts ./backend over /app/backend
# and runs uvicorn with --reload, so edits on the host trigger an in-place
# FastAPI restart (~1s) instead of a 20s+ image rebuild. Frontend and gateway
# stay baked in the image.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.hot-reload.yml up
#
# Off by default because uvicorn reloads wipe SandboxManager in-memory state
# (self._containers), which can interact badly with concurrent agent calls.

services:
  bond:
    volumes:
      - ./backend:/app/backend
    command: >-
      sh -lc "bash scripts/first-run.sh &&
      uv run --no-sync uvicorn backend.app.main:app --host 0.0.0.0 --port 18790 --reload --reload-dir /app/backend &
      cd /app/gateway && NODE_OPTIONS='--experimental-global-webcrypto' ./node_modules/.bin/tsx watch src/index.ts &
      cd /app/frontend && pnpm start &
      wait"
